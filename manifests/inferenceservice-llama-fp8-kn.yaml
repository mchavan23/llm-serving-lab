# InferenceService llama-fp8-kn - week 6, GPU NODE: the Knative-mode twin of the
# Standard llama-fp8 (same runtime, same model, same flags). Used for
#   1. data-path overhead: Standard (predictor Service) vs Knative (Kourier ->
#      queue-proxy), one replica each on its own GPU (scripts/path_overhead.py);
#   2. wake from zero: minReplicas patched to 0 (scripts/wake_test.py) -
#      FIRST TO CUT (owner).
# Validated on kind 2026-10-26: Knative accepts vllm-gpu-runtime's pod spec
# (startupProbe, /dev/shm emptyDir, securityContext kept; Knative injects its
# own preStop /wait-for-drain - do NOT add one here, it would replace it).
# timeout 600 = Knative revision timeout: the request deadline AND, at zero,
# how long the activator holds the first request while vLLM cold-starts
# (~150-250 s on this node, week 5); the 300 s default is too close.
# Knative sets terminationGracePeriodSeconds from it (600).
# Apply only when a GPU is FREE: an unschedulable new revision is marked
# failed by Knative (seen on kind).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-fp8-kn
  namespace: llm-serving
  annotations:
    serving.kserve.io/deploymentMode: Knative
spec:
  predictor:
    serviceAccountName: s3-sa
    minReplicas: 1
    maxReplicas: 1
    timeout: 600
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-gpu-runtime
      storageUri: s3://models/llama-3.1-8b-fp8
